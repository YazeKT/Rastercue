name: Bug Report
description: Bugs in the app itself
labels: [bug]
body:
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have read the [Rastercue user guide](https://github.com/YazeKT/Rastercue/blob/main/docs/USER-GUIDE.md) and used a fresh output destination when testing.
        required: true
      - label: I have searched [Rastercue issues](https://github.com/YazeKT/Rastercue/issues) and removed private information from attached logs/images.
        required: true
- type: textarea
  attributes: 
    label: Describe the Bug
    description: 💥 Say it in words. Don't put the logs here.
  validations:
    required: true
    
- type: textarea
  attributes: 
    label: To Reproduce 
    description: 🧙 How can we emulate the bug on our own machine? (Please write in steps)
  validations:
    required: true

- type: input
  attributes:
    label: Rastercue Version (or commit hash)
    description: ✍️ What version of Rastercue did you use?
  validations:
    required: true

- type: dropdown
  attributes:
    label: Platform
    description: 🧑‍💻 What operating system or distribution platform do you use? Select the last one that applies.
    options:
      - Linux
      - Mac App Store
      - Mac DMG / Homebrew
      - Flatpak
      - Windows
  validations:
    required: true

- type: input
  attributes:
    label: OS Version
    description: "✍️ For example: Ubuntu 22.04.03, macOS 12.7.3, Windows 11 23H2"
  validations:
    required: true

- type: input
  attributes:
    label: GPU Name
    description: 📝 What adapters does Windows detect, and which device does Rastercue list as engine-compatible? Rastercue has no vendor whitelist; include the probe result and actual device shown for the job.
  validations:
    required: true
    
- type: textarea
  attributes:
    label: Expected Behavior
    description: 🤓 What should've happened?
    
- type: textarea
  attributes:
    label: Screenshots
    description: 🤳 Share us your screen!

- type: textarea
  attributes: 
    label: Logs
    description: 💥 Paste only the bounded, reviewed Rastercue support bundle or redacted logs. Remove private filenames, paths and image data before submitting.
    render: sh
  validations:
    required: true
