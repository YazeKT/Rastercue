name: Feature request
description: Suggest an idea for the app itself
labels: enhancement
body:
- type: checkboxes
  attributes:
    label: Checklist
    options:
      - label: I have checked the [Rastercue documentation](https://github.com/YazeKT/Rastercue/blob/main/README.md).
        required: true
      - label: I have searched [Rastercue issues](https://github.com/YazeKT/Rastercue/issues).
        required: true
- type: textarea
  attributes: 
    label: Description
    description: 🤓 So... what's the request?
  validations:
    required: true
- type: textarea
  attributes: 
    label: Related Problem(s)
    description: 💥 Are there any problems that coerced you into filing this feature request?
- type: textarea
  attributes:
    label: Alternatives
    description: 👁️‍🗨️ Is there really no other way? Got any workarounds while the request remains unimplemented?
  validations:
    required: false
