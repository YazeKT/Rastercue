name: Build local release candidates
on:
  workflow_dispatch:
    inputs:
      rights_review_complete:
        description: 'Enable only after native/model/runtime redistribution review is complete'
        required: true
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  build:
    if: inputs.rights_review_complete
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y rpm libarchive-tools
      - run: npm ci
      - run: npm run assets:fetch -- --acknowledge-model-terms
      - run: npm run build
      - run: npm run test:rastercue
      - name: Complete corresponding engine source and notices
        shell: bash
        run: |
          git clone --depth 1 --branch 20240601-103425 https://github.com/upscayl/upscayl-ncnn.git "$RUNNER_TEMP/rastercue-native-source"
          git -C "$RUNNER_TEMP/rastercue-native-source" -c url.https://github.com/.insteadOf=git@github.com: submodule update --init --recursive
          npm run release:notices -- "$RUNNER_TEMP/rastercue-native-source"
      - run: npx electron-builder --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: Rastercue-${{ runner.os }}-unsigned
          path: |
            dist/*.exe
            dist/*.zip
            dist/*.dmg
            dist/*.AppImage
            dist/*.deb
            dist/*.rpm
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error
